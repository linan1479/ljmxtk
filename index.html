<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考理解性默写练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: linear-gradient(135deg, #f5f0e8 0%, #ede4d3 100%);
    min-height: 100vh;
    padding: 24px;
    color: #3a2e1f;
    font-size: 18px;
  }

  .container { max-width: 900px; margin: 0 auto; }

  header { text-align: center; padding: 36px 0 24px; }
  header h1 {
    font-size: 36px; color: #8b4513;
    letter-spacing: 5px; margin-bottom: 10px;
  }
  header p { font-size: 17px; color: #a08060; letter-spacing: 2px; }

  .nav-tabs { display: flex; justify-content: center; margin-bottom: 28px; }
  .nav-tab {
    padding: 13px 40px; font-size: 18px; font-family: inherit;
    letter-spacing: 2px; cursor: pointer; border: 1px solid #c4a882;
    background: #fff; color: #8b6f4e; transition: all 0.2s;
  }
  .nav-tab:first-child { border-radius: 9px 0 0 9px; }
  .nav-tab:last-child { border-radius: 0 9px 9px 0; }
  .nav-tab.active {
    background: linear-gradient(135deg, #b5651d, #8b4513);
    color: #fff; border-color: #8b4513;
  }
  .nav-tab:not(.active):hover { background: #faf6f0; }

  .start-area { text-align: center; padding: 60px 0; }
  .btn-start {
    display: inline-block; padding: 20px 68px;
    font-size: 24px; font-family: inherit; letter-spacing: 7px;
    color: #fff; background: linear-gradient(135deg, #b5651d, #8b4513);
    border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 5px 18px rgba(139, 69, 19, 0.3);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 24px rgba(139, 69, 19, 0.4);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .panel-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 22px; padding: 0 4px;
  }
  .panel-header span { font-size: 18px; color: #8b6f4e; }

  .btn-refresh {
    padding: 11px 28px; font-size: 17px; font-family: inherit;
    letter-spacing: 2px; color: #8b4513; background: #fff;
    border: 1px solid #c4a882; border-radius: 7px;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-refresh:hover { background: #f5f0e8; }

  .question-card {
    background: #fff; border-radius: 12px;
    padding: 28px 32px; margin-bottom: 22px;
    box-shadow: 0 2px 12px rgba(139, 69, 19, 0.08);
    border-left: 6px solid #c4a882;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
  }
  .card-top-left { display: flex; align-items: center; gap: 12px; }

  .question-num {
    display: inline-block; font-size: 15px; color: #fff;
    background: #b5651d; border-radius: 5px;
    padding: 4px 14px; letter-spacing: 1px;
  }

  .btn-fav {
    background: none; border: none; cursor: pointer;
    font-size: 28px; color: #d4c4a8;
    transition: transform 0.2s, color 0.2s;
    padding: 4px 8px; line-height: 1;
  }
  .btn-fav:hover { transform: scale(1.2); }
  .btn-fav.faved { color: #e8a020; }

  .fav-checkbox {
    width: 22px; height: 22px;
    cursor: pointer; accent-color: #8b4513; flex-shrink: 0;
  }

  .question-source {
    font-size: 15px; color: #a08060;
    margin-bottom: 12px; letter-spacing: 1px;
  }
  .question-text {
    font-size: 20px; line-height: 2.0;
    color: #3a2e1f; margin-bottom: 16px;
  }
  .question-text .blank {
    display: inline-block; min-width: 92px;
    border-bottom: 2px solid #8b4513; margin: 0 5px;
    text-align: center; color: #b5651d; font-weight: bold;
  }

  .card-actions { display: flex; gap: 12px; }
  .btn-answer {
    padding: 10px 26px; font-size: 17px; font-family: inherit;
    letter-spacing: 2px; color: #8b4513; background: #faf6f0;
    border: 1px solid #c4a882; border-radius: 7px;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-answer:hover { background: #f0e8da; }

  .answer-box {
    display: none; margin-top: 16px; padding: 18px 22px;
    background: #fdf9f3; border-radius: 10px;
    border: 1px dashed #c4a882; font-size: 19px;
    line-height: 2.0; color: #5a3e1b;
    animation: fadeIn 0.3s ease both;
  }
  .answer-box .answer-label {
    font-size: 15px; color: #a08060;
    letter-spacing: 2px; margin-bottom: 8px;
  }
  .answer-box .answer-content { font-weight: bold; color: #8b4513; }

  .fav-empty {
    text-align: center; padding: 70px 20px;
    color: #b8a88a; font-size: 19px; letter-spacing: 2px;
  }
  .fav-empty .icon { font-size: 56px; margin-bottom: 18px; }

  .fav-batch-bar {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 22px;
    padding: 16px 22px; background: #fff;
    border-radius: 10px; border: 1px solid #e8dcc8;
    box-shadow: 0 1px 5px rgba(139, 69, 19, 0.06);
  }
  .fav-batch-left {
    display: flex; align-items: center; gap: 18px;
    font-size: 17px; color: #8b6f4e; letter-spacing: 1px;
  }
  .fav-batch-left label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }

  .btn-batch-delete {
    padding: 11px 26px; font-size: 17px; font-family: inherit;
    letter-spacing: 1px; color: #fff;
    background: #c0392b; border: none;
    border-radius: 7px; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-batch-delete:hover { background: #a83224; }
  .btn-batch-delete:disabled {
    background: #d8c9b0; cursor: not-allowed;
  }

  .btn-remove {
    padding: 9px 22px; font-size: 16px; font-family: inherit;
    color: #c0392b; background: #fdf2f0;
    border: 1px solid #e8c4bc; border-radius: 7px;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-remove:hover { background: #f8e4e0; }

  footer {
    text-align: center; padding: 44px 0 22px;
    font-size: 14px; color: #b8a88a; letter-spacing: 1px;
  }

  .toast {
    position: fixed; bottom: 34px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #3a2e1f; color: #f5f0e8;
    padding: 13px 30px; border-radius: 24px;
    font-size: 17px; letter-spacing: 1px;
    opacity: 0; transition: all 0.3s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>理解性默写练习</h1>
    <p>高考必背古诗文 · 每次随机五题</p>
  </header>

  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('practice')">练习模式</div>
    <div class="nav-tab" onclick="switchTab('favorites')">我的收藏 <span id="favCount"></span></div>
  </div>

  <div class="panel active" id="panel-practice">
    <div class="start-area" id="startArea">
      <button class="btn-start" onclick="startQuiz()">开 始 练 习</button>
    </div>
    <div id="quizArea" style="display:none;">
      <div class="panel-header">
        <span>📖 本次共 5 题</span>
        <button class="btn-refresh" onclick="startQuiz()">换一组题目</button>
      </div>
      <div id="questionList"></div>
    </div>
  </div>

  <div class="panel" id="panel-favorites">
    <div id="favList"></div>
  </div>

  <footer>点击题目下方按钮查看答案 · 建议先自行书写再核对</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================

   ------------------------------------------------------------
   严格遵循高考真题题型：

     · 答案均为完整的一句或两句，不存在“给上句填下句”
   ------------------------------------------------------------
   ★ 如何自行更新题库 ★
   在数组末尾按下述格式追加对象即可：

/* ============================================================
   本地存储管理（收藏夹）
   ============================================================ */
const FAV_KEY = 'gaokao_quiz_favorites';

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveFavorites(arr) {
  localStorage.setItem(FAV_KEY, JSON.stringify(arr));
}

function isFaved(id) {
  return getFavorites().includes(id);
}

function toggleFavorite(id) {
  let favs = getFavorites();
  const idx = favs.indexOf(id);
  if (idx > -1) {
    favs.splice(idx, 1);
    showToast('已取消收藏');
  } else {
    favs.push(id);
    showToast('已加入收藏 ★');
  }
  saveFavorites(favs);
  return favs.includes(id);
}

/* ============================================================
   页面逻辑
   ============================================================ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach((el, i) => {
    el.classList.toggle('active', i === (tab === 'practice' ? 0 : 1));
  });
  document.getElementById('panel-practice').classList.toggle('active', tab === 'practice');
  document.getElementById('panel-favorites').classList.toggle('active', tab === 'favorites');

  if (tab === 'favorites') {
    renderFavorites();
  } else {
    syncAllFavButtons();
  }
  updateFavCount();
}

function updateFavCount() {
  const n = getFavorites().length;
  document.getElementById('favCount').textContent = n > 0 ? `(${n})` : '';
}

function pickRandom(n) {
  const arr = [...QUESTION_BANK];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, Math.min(n, arr.length));
}

function formatQuestionText(text) {
  return text.replace(/_{4,}/g, '<span class="blank">________</span>');
}

function syncAllFavButtons() {
  document.querySelectorAll('.question-card[data-id]').forEach(card => {
    const id = parseInt(card.dataset.id, 10);
    const btn = card.querySelector('.btn-fav');
    if (!btn) return;
    const faved = isFaved(id);
    btn.classList.toggle('faved', faved);
    btn.textContent = faved ? '★' : '☆';
    btn.title = faved ? '取消收藏' : '加入收藏';
  });
}

function renderQuestionCard(q, index, inFavPanel) {
  const faved = isFaved(q.id);
  return `
    <div class="question-card" style="animation-delay:${index * 0.08}s" data-id="${q.id}">
      <div class="card-top">
        <div class="card-top-left">
          ${inFavPanel
            ? `<input type="checkbox" class="fav-checkbox" data-id="${q.id}"
                       onchange="updateBatchBar()" title="选择此题">`
            : ''}
          <span class="question-num">第 ${index + 1} 题</span>
        </div>
        <button class="btn-fav ${faved ? 'faved' : ''}"
                onclick="handleFavClick(this, ${q.id})"
                title="${faved ? '取消收藏' : '加入收藏'}">${faved ? '★' : '☆'}</button>
      </div>
      <div class="question-source">📜 ${q.source}</div>
      <div class="question-text">${formatQuestionText(q.text)}</div>
      <div class="card-actions">
        <button class="btn-answer" onclick="toggleAnswer(this)">查看答案</button>
        ${inFavPanel ? `<button class="btn-remove" onclick="handleRemoveFav(${q.id})">取消收藏</button>` : ''}
      </div>
      <div class="answer-box">
        <div class="answer-label">参考答案</div>
        <div class="answer-content">${q.answer}</div>
      </div>
    </div>`;
}

function handleFavClick(btn, id) {
  const nowFaved = toggleFavorite(id);
  btn.classList.toggle('faved', nowFaved);
  btn.textContent = nowFaved ? '★' : '☆';
  btn.title = nowFaved ? '取消收藏' : '加入收藏';
  updateFavCount();
  syncAllFavButtons();
}

function handleRemoveFav(id) {
  toggleFavorite(id);
  updateFavCount();
  renderFavorites();
  syncAllFavButtons();
}

function startQuiz() {
  const questions = pickRandom(5);

  document.getElementById('startArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';

  document.getElementById('questionList').innerHTML =
    questions.map((q, i) => renderQuestionCard(q, i, false)).join('');
}

function toggleAnswer(btn) {
  const box = btn.closest('.question-card').querySelector('.answer-box');
  const visible = box.style.display === 'block';
  box.style.display = visible ? 'none' : 'block';
  btn.textContent = visible ? '查看答案' : '隐藏答案';
}

function renderFavorites() {
  const favIds = getFavorites();
  const list = document.getElementById('favList');

  if (favIds.length === 0) {
    list.innerHTML = `
      <div class="fav-empty">
        <div class="icon">☆</div>
        <p>暂无收藏题目</p>
        <p style="font-size:15px;margin-top:10px;">在练习模式中点击题目右上角的星标即可收藏</p>
      </div>`;
    return;
  }

  const favQuestions = favIds
    .map(id => QUESTION_BANK.find(q => q.id === id))
    .filter(Boolean);

  list.innerHTML = `
    <div class="fav-batch-bar">
      <div class="fav-batch-left">
        <label>
          <input type="checkbox" id="selectAll" class="fav-checkbox" onchange="toggleSelectAll()">
          全选
        </label>
        <span>⭐ 已收藏 ${favQuestions.length} 道题</span>
      </div>
      <button class="btn-batch-delete" id="batchDeleteBtn" onclick="batchDelete()" disabled>
        删除选中 (0)
      </button>
    </div>
    ${favQuestions.map((q, i) => renderQuestionCard(q, i, true)).join('')}`;
}

function updateBatchBar() {
  const allBoxes = document.querySelectorAll('.fav-checkbox[data-id]');
  const checkedBoxes = document.querySelectorAll('.fav-checkbox[data-id]:checked');
  const selectAll = document.getElementById('selectAll');
  const btn = document.getElementById('batchDeleteBtn');

  if (!btn) return;

  const count = checkedBoxes.length;
  btn.textContent = `删除选中 (${count})`;
  btn.disabled = count === 0;

  if (selectAll) {
    selectAll.checked = allBoxes.length > 0 && count === allBoxes.length;
    selectAll.indeterminate = count > 0 && count < allBoxes.length;
  }
}

function toggleSelectAll() {
  const selectAll = document.getElementById('selectAll');
  document.querySelectorAll('.fav-checkbox[data-id]').forEach(cb => {
    cb.checked = selectAll.checked;
  });
  updateBatchBar();
}

function batchDelete() {
  const checked = document.querySelectorAll('.fav-checkbox[data-id]:checked');
  if (checked.length === 0) {
    showToast('请先选择要删除的题目');
    return;
  }
  if (!confirm(`确定要删除选中的 ${checked.length} 道收藏题吗？`)) return;

  const idsToDelete = Array.from(checked).map(cb => parseInt(cb.dataset.id, 10));
  const remaining = getFavorites().filter(id => !idsToDelete.includes(id));

  saveFavorites(remaining);
  updateFavCount();
  renderFavorites();
  syncAllFavButtons();
  showToast(`已删除 ${idsToDelete.length} 道题`);
}

/* 初始化 */
document.addEventListener('DOMContentLoaded', () => {
  updateFavCount();
  renderFavorites();
});
</script>
